[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "arcgraph"
version = "0.1.0"
description = "Local-first code semantic graph engine for AI agents and code intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [
    { name = "ArcGraph Maintainers" },
]
keywords = ["code-intelligence", "static-analysis", "architecture", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "defusedxml>=0.7.1,<0.8.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1,<27.0.0",
    "build>=1.5.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.15,<0.16.0",
]
mcp = [
    "mcp>=2.0.0,<3.0.0",
]
security = [
    "bandit>=1.9.4,<2.0.0",
    "cyclonedx-bom>=7.3.1,<8.0.0",
    "pip-audit>=2.10.1,<3.0.0",
]

[project.scripts]
arcgraph = "arcgraph.interfaces.cli:main"

[project.urls]
Homepage = "https://github.com/glyphevo/arcgraph"
Repository = "https://github.com/glyphevo/arcgraph"
Changelog = "https://github.com/glyphevo/arcgraph/blob/main/RELEASE_NOTES.md"
Issues = "https://github.com/glyphevo/arcgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["arcgraph"]
exclude = [
    "/arcgraph/tests",
    "/arcgraph/tests/**",
    "/arcgraph/semantic_prototype",
    "/arcgraph/semantic_prototype/**",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/AGENTS.md",
    "/arcgraph/tests",
    "/arcgraph/tests/**",
    "/scripts/tests",
    "/scripts/tests/**",
    "/docs/_internal",
    "/docs/_internal/**",
    "/output",
    "/output/**",
    "/dist",
    "/dist/**",
    "/node_modules",
    "/node_modules/**",
    "/.pytest_cache",
    "/.pytest_cache/**",
    "/.ruff_cache",
    "/.ruff_cache/**",
    "/.coverage",
    "/.claude",
    "/.claude/**",
]

[tool.hatch.build.targets.wheel.force-include]
"arcgraph/assets/workbench/index.html" = "arcgraph/assets/workbench/index.html"
"arcgraph/assets/workbench/vendor/d3.v7.min.js" = "arcgraph/assets/workbench/vendor/d3.v7.min.js"
"arcgraph/assets/workbench/vendor/LICENSE.d3.txt" = "arcgraph/assets/workbench/vendor/LICENSE.d3.txt"

[tool.pytest.ini_options]
testpaths = ["arcgraph/tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.bandit]
exclude_dirs = ["arcgraph/tests"]
skips = [
    "B110", # Best-effort metadata parsing falls back without affecting trust decisions.
    "B404", # Subprocess use is explicit and reviewed; executable inputs are not request-controlled.
    "B603", # Subprocess calls use argument arrays and fixed command families.
    "B607", # Git/Node/tool discovery intentionally follows the local operator PATH.
    "B608", # Dynamic SQL fragments are allowlisted clauses or parameter placeholder counts.
]

[tool.arcgraph]
source_roots = ["."]

[tool.arcgraph.ci.coverage]
# Statement coverage floor for the full suite, enforced by the Quality lane in
# .github/workflows/ci.yml (the only lane that runs --cov, and the one that
# runs the full platform-eligible suite; Windows skips 29, so its figure is not comparable).
#
# Whole-repository statement coverage is a regression guard, not proof of
# change-specific adequacy. Do not lower the floor to pass a failing change.
floor_percent = 92

[tool.arcgraph.ci.semantic_quality_targets]
# The overall and attribute targets were 0.95 and 0.92 until the maintainer
# lowered them on 2026-10-06, when the analyzers stopped linking calls on
# receivers typed Any, or on a value typed as its own callee, to targets that
# do not exist, such as typing.Any.execute or builtins.dict.get.get. Those
# targets had counted as resolved; the rates they inflated were 0.9617 and
# 0.9333, and are 0.9502 and 0.9145 without them.
overall_callsite_resolution_rate = 0.945
attribute_call_resolution_rate = 0.91
chain_call_resolution_rate = 0.89
known_framework_registration_resolution_rate = 0.95

[tool.arcgraph.ci.semantic_resolution_baseline]
# The overall callsite resolution rate this repository has already reached.
# `semantic_resolution_trend` fails when a build falls more than its tolerance
# below this value, which turns the quality gate from a fixed target the
# repository grows into, into a ratchet against its own best measured state.
# Raise it deliberately after a verified improvement; never lower it to make a
# build pass. Measured with `arcgraph semantic-stats`. The one exception so
# far, by the maintainer's decision on 2026-10-06, re-measured it from 0.9693
# when the rate stopped counting links to targets that do not exist (see the
# targets above): it is not a lower bar, but the same bar without them.
resolution_rate = 0.9498

# Innermost first. An import from an earlier entry to a later one runs against
# the dependency direction and is reported by the `layer_violations` check.
#
# The normative statement of the direction is in
# docs/architecture.md, which
# permits interfaces -> change -> {GraphStoreReader, QueryEngine, cleanup,
# operation_lock, evidence_manifest} and forbids change -> interfaces and
# QueryEngine -> change. This model is derived from it and is deliberately
# stricter in one respect: it forbids any core -> change import, not only
# QueryEngine's. It is also narrower in one respect, because an import graph
# cannot express that document's third rule, that GraphStore semantic tables
# must not depend on Plan, Decision or Report.
[[tool.arcgraph.ci.layers]]
name = "core"
paths = ["arcgraph/core/"]
[[tool.arcgraph.ci.layers]]
name = "analyzers"
paths = ["arcgraph/analyzers/"]
[[tool.arcgraph.ci.layers]]
name = "adapters"
paths = ["arcgraph/adapters/"]
[[tool.arcgraph.ci.layers]]
name = "pipeline"
paths = ["arcgraph/pipeline/"]
[[tool.arcgraph.ci.layers]]
name = "change"
paths = ["arcgraph/change/"]
[[tool.arcgraph.ci.layers]]
name = "providers"
paths = ["arcgraph/providers/"]
[[tool.arcgraph.ci.layers]]
name = "interfaces"
paths = ["arcgraph/interfaces/"]

[[tool.arcgraph.ci.layer_exemptions]]
from = "core"
to = "change"
reason = """\
core/cleanup.py validates the pinned-build records that the change layer \
writes, so it must agree with that layer on CHANGE_CONTRACT_VERSION before it \
will delete a build. Refusing to delete a build pinned under a contract it \
cannot read is the safety property; moving the constant into core would hide \
the coupling from this check without removing it. The architecture document \
lists cleanup as something change depends on, not the reverse, so this is a \
declared deviation from it rather than an omission in it."""

[tool.arcgraph.ci.semantic_quality_scope]
exclude = ["arcgraph/tests/fixtures/**"]
