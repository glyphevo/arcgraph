name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  quality:
    name: Quality / Ubuntu / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,mcp]"
          npm ci

      - name: Run unit and script tests with coverage
        env:
          ARCGRAPH_REQUIRE_TS: '1'
        run: |
          mkdir -p output/arcgraph
          python -m pytest arcgraph/tests scripts/tests -q --cov=arcgraph --cov-report=xml:output/arcgraph/coverage.xml --cov-report=term --cov-fail-under=92

      - name: Check formatting and lint
        run: |
          python -m black arcgraph scripts --check
          python -m ruff check arcgraph scripts

      - name: Build local index
        run: python scripts/arcgraph.py build

      - name: Run ArcGraph CI
        run: python scripts/arcgraph.py ci

      - name: Run release gate
        run: python scripts/arcgraph_release_gate.py

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-python-3.11
          path: output/arcgraph/coverage.xml
          if-no-files-found: error
          retention-days: 14

  test-matrix:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - '3.11'
          - '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,mcp]"
          npm ci

      - name: Run cross-platform tests
        env:
          ARCGRAPH_REQUIRE_TS: '1'
        run: python -m pytest arcgraph/tests scripts/tests -q

  package-matrix:
    name: Package / ${{ matrix.os }} / Python ${{ matrix.python }} / MCP ${{ matrix.mcp_line }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            mcp_line: lower
            mcp_spec: mcp==2.0.0
          - os: ubuntu-latest
            python: '3.11'
            mcp_line: latest-2x
            mcp_spec: mcp>=2.0.0,<3.0.0
          - os: windows-latest
            python: '3.12'
            mcp_line: latest-2x
            mcp_spec: mcp>=2.0.0,<3.0.0
          - os: macos-latest
            python: '3.12'
            mcp_line: latest-2x
            mcp_spec: mcp>=2.0.0,<3.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install package-smoke prerequisites
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Build, install, and exercise package artifacts
        run: |
          python -c "from pathlib import Path; Path('output/release').mkdir(parents=True, exist_ok=True)"
          python scripts/arcgraph_package_readiness_smoke.py --mcp-version-spec "${{ matrix.mcp_spec }}" > output/release/package-readiness.json

      - name: Upload package provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-readiness-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.mcp_line }}
          path: output/release/package-readiness.json
          if-no-files-found: error
          retention-days: 14

  typescript-acceptance:
    name: TypeScript / Node ${{ matrix.node }} / TS ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            typescript: '5.4.5'
          - node: '20'
            typescript: '5.9.3'
          - node: '22'
            typescript: '5.9.3'
          - node: '24'
            typescript: '5.9.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install acceptance toolchain
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npm install --no-save --ignore-scripts typescript@${{ matrix.typescript }}

      - name: Run formal TypeScript acceptance contract
        env:
          ARCGRAPH_REQUIRE_TS: '1'
        run: |
          python -m pytest -q \
            arcgraph/tests/test_typescript_baseline.py \
            arcgraph/tests/test_typescript_esm_resolution.py \
            arcgraph/tests/test_typescript_package_exports.py \
            arcgraph/tests/test_typescript_conditional_exports.py \
            arcgraph/tests/test_typescript_express_routes.py \
            arcgraph/tests/test_typescript_similarity.py

  security:
    name: Security / Audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,mcp,security]"
          npm ci

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p output/security
          python -m cyclonedx_py environment --output-format JSON --output-file output/security/arcgraph.cdx.json

      - name: Audit Python dependencies
        run: |
          python -m pip freeze --exclude-editable > output/security/python-audit-requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps --requirement output/security/python-audit-requirements.txt --format json --output output/security/pip-audit.json

      - name: Audit Node development dependencies
        run: |
          test "$(npx --yes npm@11.12.1 --version)" = "11.12.1"
          npx --yes npm@11.12.1 audit --audit-level=high --json > output/security/npm-audit.json

      - name: Scan Python source
        run: python -m bandit -c pyproject.toml -r arcgraph scripts -x arcgraph/tests,scripts/tests -f json -o output/security/bandit.json

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-evidence
          path: output/security
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - quality
      - test-matrix
      - package-matrix
      - typescript-acceptance
      - security
    steps:
      - name: Require every CI lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_MATRIX_RESULT: ${{ needs['test-matrix'].result }}
          PACKAGE_MATRIX_RESULT: ${{ needs['package-matrix'].result }}
          TYPESCRIPT_ACCEPTANCE_RESULT: ${{ needs['typescript-acceptance'].result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_MATRIX_RESULT" = "success"
          test "$PACKAGE_MATRIX_RESULT" = "success"
          test "$TYPESCRIPT_ACCEPTANCE_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
